<svg width="120" height="120" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nwGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0284C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0A0A0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle for contrast -->
  <circle cx="100" cy="100" r="95" fill="white" opacity="0.05"/>

  <!-- Top left blue dot -->
  <circle cx="45" cy="50" r="8" fill="url(#nwGradient)" />

  <!-- Bottom right blue dot -->
  <circle cx="155" cy="150" r="8" fill="url(#nwGradient)" />

  <!-- Top orbit curve -->
  <path d="M 45 50 Q 100 25 155 60" stroke="url(#nwGradient)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Bottom orbit curve -->
  <path d="M 50 150 Q 100 175 155 150" stroke="url(#nwGradient)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Letter N - Blue -->
  <g>
    <!-- Left vertical of N -->
    <path d="M 50 140 L 50 60" stroke="url(#nwGradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Diagonal of N -->
    <path d="M 50 60 L 85 130" stroke="url(#nwGradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right vertical of N -->
    <path d="M 85 60 L 85 140" stroke="url(#nwGradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Letter W - Silver/Gray -->
  <g>
    <!-- Left down of W -->
    <path d="M 105 60 L 115 140" stroke="url(#silverGradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Middle peak of W -->
    <path d="M 115 140 L 130 75" stroke="url(#silverGradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right down of W -->
    <path d="M 130 75 L 145 140" stroke="url(#silverGradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Far right up of W -->
    <path d="M 145 140 L 160 60" stroke="url(#silverGradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
